<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nexotizzy</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="icon.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EduStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEEAE2;
    --surface:#FFFFFF;
    --surface-2:#F6F3EC;
    --ink:#1E2B3C;
    --ink-soft:#51606F;
    --muted:#8A8F98;
    --gold:#C9973F;
    --gold-dark:#AD7F30;
    --line:#E4DFD2;
    --danger:#B3452F;
    --success:#2E7D5B;
    --shadow: 0 10px 30px rgba(30,43,60,.08);
    --radius: 18px;
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body.dark{
    --bg:#141A22;
    --surface:#1C2530;
    --surface-2:#212B37;
    --ink:#EFEAE0;
    --ink-soft:#B7C0C9;
    --muted:#7C8894;
    --gold:#D8A94F;
    --gold-dark:#E4BA6C;
    --line:#2B3542;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background .25s ease, color .25s ease;
  }
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    box-shadow:var(--shadow);
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--ink);}
  p{margin:0; color:var(--ink-soft); line-height:1.55;}
  button{font-family:var(--font-body); cursor:pointer; border:none; background:none;}
  a{color:inherit; text-decoration:none;}
  input,select,textarea{font-family:var(--font-body);}
  svg{display:block;}

  /* Header */
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:9px; cursor:pointer;}
  .logo .dot{width:9px; height:9px; border-radius:50%; background:var(--gold);}
  .logo span{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.2px;}
  .head-icons{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:var(--surface); position:relative;
    color:var(--ink);
  }
  .icon-btn svg{width:18px; height:18px;}
  .badge-count{
    position:absolute; top:-4px; right:-4px;
    background:var(--danger); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* Nav drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.42);
    z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:-320px; width:280px; max-width:82vw; height:100%;
    background:var(--surface); z-index:50; box-shadow:-10px 0 30px rgba(0,0,0,.2);
    transition:right .25s ease; display:flex; flex-direction:column; padding:20px;
  }
  .drawer.show{right:0;}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .drawer-head h3{font-size:18px;}
  .drawer nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
  .drawer nav button{
    display:flex; align-items:center; gap:12px; text-align:left;
    padding:13px 10px; border-radius:12px; font-size:15px; font-weight:500; color:var(--ink);
  }
  .drawer nav button:active{background:var(--surface-2);}
  .drawer nav .ic{width:20px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .drawer hr{border:none; border-top:1px solid var(--line); margin:12px 0;}
  .drawer .add-cta{
    background:var(--ink); color:var(--surface); border-radius:12px; font-weight:600;
  }
  .drawer .add-cta .ic{color:var(--surface);}
  .drawer .add-cta:active{opacity:.85;}
  .drawer .theme-row{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 10px; border-top:1px solid var(--line); padding-top:16px;
  }
  .switch{width:42px; height:24px; border-radius:12px; background:var(--line); position:relative; transition:.2s;}
  .switch .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.2s;}
  body.dark .switch{background:var(--gold);}
  body.dark .switch .knob{left:20px;}

  /* Favorites panel */
  .fav-panel{
    position:fixed; top:0; right:-320px; width:300px; max-width:86vw; height:100%;
    background:var(--surface); z-index:50; box-shadow:-10px 0 30px rgba(0,0,0,.2);
    transition:right .25s ease; padding:20px; overflow-y:auto;
  }
  .fav-panel.show{right:0;}
  .fav-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center;}
  .fav-item img{width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--surface-2);}
  .fav-item .t{flex:1; min-width:0;}
  .fav-item .t b{display:block; font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fav-item .t small{color:var(--muted); font-size:12px;}

  main{padding-bottom:40px;}

  /* Hero */
  .hero{padding:34px 22px 10px;}
  .eyebrow{color:var(--gold-dark); font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .eyebrow::before{content:""; width:20px; height:1px; background:var(--gold-dark);}
  .hero h1{font-size:38px; line-height:1.12; font-weight:700; margin-bottom:16px;}
  .hero p.lead{font-size:15px; max-width:34ch; margin-bottom:22px;}
  .hero-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{padding:13px 20px; border-radius:12px; font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; gap:6px;}
  .btn-dark{background:var(--ink); color:var(--surface);}
  .btn-dark:active{opacity:.85;}
  .btn-gold{background:var(--gold); color:#26210F;}
  .btn-gold:active{background:var(--gold-dark);}
  .btn-outline{border:1px solid var(--line); color:var(--ink); background:var(--surface);}

  .stats{display:flex; gap:0; padding:30px 22px 6px; border-bottom:1px solid var(--line);}
  .stat{flex:1;}
  .stat b{display:block; font-family:var(--font-display); font-size:26px; color:var(--ink);}
  .stat span{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:600;}

  /* Sections */
  .section{padding:30px 22px 6px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{font-size:22px;}
  .section-head a, .section-head button.link{font-size:13px; color:var(--gold-dark); font-weight:600;}

  .cats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .cat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .cat-card .ic{color:var(--gold-dark);}
  .cat-card .ic svg{width:22px; height:22px;}
  .cat-card span.lbl{font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .cat-card:active{background:var(--surface-2);}

  .rail{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; margin:0 -22px; padding-left:22px; padding-right:22px; scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .rail .card{flex:0 0 76%;}

  .grid{display:flex; flex-direction:column; gap:14px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    position:relative; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .card.pressing{opacity:.82; transform:scale(.985);}
  .lp-bar{
    position:absolute; left:0; bottom:0; height:4px; width:0%;
    background:var(--danger); z-index:3;
  }
  .card-media{
    height:170px; background-size:cover; background-position:center; position:relative;
    background-color:var(--surface-2);
  }
  .card-media::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%);}
  .badge-type{
    position:absolute; top:12px; left:12px; z-index:2;
    background:var(--gold); color:#26210F; font-size:10.5px; font-weight:700;
    letter-spacing:.6px; padding:5px 10px; border-radius:20px;
  }
  .heart{
    position:absolute; top:10px; right:10px; z-index:2;
    width:32px; height:32px; border-radius:50%; background:rgba(20,20,20,.42);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .heart svg{width:16px; height:16px;}
  .heart.active svg{fill:#E0644B; stroke:#E0644B;}
  .card-body{padding:14px 16px 16px;}
  .card-tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.3px;}
  .card-tag svg{width:12px; height:12px;}
  .card-title{font-size:16.5px; font-weight:700; margin:5px 0 3px; line-height:1.3;}
  .card-author{font-size:12.5px; color:var(--muted); margin-bottom:10px;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .card-price{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .btn-ver{padding:8px 16px; border-radius:20px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--surface); color:var(--ink);}
  .btn-ver:active{background:var(--ink); color:var(--surface);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--muted);
  }
  .empty .ic{color:var(--muted); margin-bottom:12px; display:flex; align-items:center; justify-content:center;}
  .empty .ic svg{width:32px; height:32px;}
  .empty h3{font-size:17px; color:var(--ink); margin-bottom:6px;}
  .empty p{font-size:13.5px; margin-bottom:18px;}

  /* Catalog header (type tabs) */
  .catalog-top{padding:18px 22px 0;}
  .back-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .back-btn{width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .back-btn svg{width:16px; height:16px;}
  .catalog-title{font-size:22px;}
  .tabs{display:flex; gap:8px; margin:14px 0 18px; overflow-x:auto;}
  .tab{padding:9px 15px; border-radius:20px; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--surface); white-space:nowrap;}
  .tab.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}
  .catalog-list{padding:0 22px 30px;}

  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin:14px 0 18px;
  }
  .search-box .ic{color:var(--muted); display:flex;}
  .search-box .ic svg{width:18px; height:18px;}
  .search-box input{flex:1; border:none; background:none; font-size:14.5px; color:var(--ink); outline:none;}
  .search-box input::placeholder{color:var(--muted);}
  .del-hint{text-align:center; margin-top:16px;}

  /* Add type select */
  .type-pick{padding:24px 22px 30px; display:flex; flex-direction:column; gap:12px;}
  .type-opt{
    display:flex; align-items:center; gap:14px; padding:18px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line); text-align:left;
  }
  .type-opt .ic{color:var(--gold-dark); width:26px; display:flex; align-items:center; justify-content:center;}
  .type-opt .ic svg{width:24px; height:24px;}
  .type-opt .tx b{display:block; font-size:15.5px; color:var(--ink);}
  .type-opt .tx span{font-size:12.5px; color:var(--muted);}
  .type-opt:active{background:var(--surface-2);}

  /* Form */
  form.pform{padding:20px 22px 40px; display:flex; flex-direction:column; gap:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:7px; letter-spacing:.2px;}
  .field input[type=text], .field input[type=url], .field input[type=number], .field select, .field textarea{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:14.5px;
  }
  .field textarea{resize:vertical; min-height:80px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .img-pick{
    border:1.5px dashed var(--line); border-radius:16px; padding:16px; text-align:center; cursor:pointer;
    background:var(--surface-2); display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .img-pick img{width:100%; max-height:170px; object-fit:cover; border-radius:12px;}
  .img-pick .ic{color:var(--muted);}
  .img-pick .ic svg{width:26px; height:26px;}
  .img-pick small{color:var(--muted); font-size:12px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:6px;}
  .submit-row{margin-top:6px;}
  .btn-block{width:100%; justify-content:center; padding:15px;}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.5); z-index:60;
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0;
    padding:26px 24px 30px; transform:translateY(30px); transition:transform .25s ease;
  }
  .modal-overlay.show .modal{transform:translateY(0);}
  .modal h3{font-size:19px; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
  .modal h3 svg{width:18px; height:18px; color:var(--gold-dark);}
  .modal p.sub{font-size:13.5px; margin-bottom:18px;}
  .modal input[type=password]{
    width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); font-size:16px; letter-spacing:2px;
    text-align:center; background:var(--surface-2); color:var(--ink);
  }
  .modal .err{color:var(--danger); font-size:12.5px; margin-top:8px; min-height:16px; text-align:center;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1; padding:13px; border-radius:12px; font-weight:600; font-size:14px;}

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:80;
    background:var(--ink); color:var(--surface); padding:13px 20px; border-radius:30px; font-size:13.5px;
    font-weight:600; box-shadow:0 10px 24px rgba(0,0,0,.25); opacity:0; transition:.25s; max-width:88%;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  ::selection{background:var(--gold); color:#26210F;}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="logo" onclick="navigate('home')">
      <span class="dot"></span>
      <span>EduStore</span>
    </div>
    <div class="head-icons">
      <button class="icon-btn" onclick="navigate('search')" aria-label="Pesquisar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Alternar tema" id="themeBtn"></button>
      <button class="icon-btn" onclick="openFav()" aria-label="Favoritos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12v20l-6-4-6 4V2z"/></svg>
        <span class="badge-count" id="favCount" style="display:none">0</span>
      </button>
      <button class="icon-btn" onclick="openDrawer()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <main id="app"></main>
</div>

<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Menu</h3>
    <button class="icon-btn" onclick="closeAllPanels()" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav id="drawerNav"></nav>
  <div class="theme-row">
    <span style="font-size:14px; font-weight:500;">Modo escuro</span>
    <button class="switch" onclick="toggleTheme()"><span class="knob"></span></button>
  </div>
</div>

<div class="fav-panel" id="favPanel">
  <div class="drawer-head">
    <h3>Favoritos</h3>
    <button class="icon-btn" onclick="closeAllPanels()" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="favList"></div>
</div>

<div class="modal-overlay" id="pwOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p class="sub" id="modalSub">Introduz a senha de administrador para publicar este produto.</p>
    <input type="password" id="pwInput" inputmode="text" autocomplete="off" placeholder="••••">
    <div class="err" id="pwErr"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closePwModal()">Cancelar</button>
      <button class="btn-dark" onclick="confirmPassword()">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- ícones (SVG, sem emoji) ---------- */
const ICON_PATHS = {
  home: '<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
  book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V4.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/>',
  cap: '<path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/><path d="M22 8v6"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-6 6"/>',
  heart: '<path d="M12 21s-7.5-4.9-10-9.3C.5 8 2.4 4.5 6 4c2-.3 3.7.7 6 3 2.3-2.3 4-3.3 6-3 3.6.5 5.5 4 4 7.7C19.5 16.1 12 21 12 21z"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
  code: '<polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/>',

function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- navegação (com histórico p/ botão voltar do Android) ---------- */
function navigate(view, params, replace){
  params = params || {};
  state = { view, params };
  closeAllPanels();
  const histState = { view, params };
  if(replace){ history.replaceState(histState, ''); } else { history.pushState(histState, ''); }
  render();
  window.scrollTo(0,0);
}
window.addEventListener('popstate', (e)=>{
  if(e.state){ state = e.state; } else { state = { view:'home', params:{} }; }
  closeAllPanels();
  render();
});

/* ---------- favoritos ---------- */
function toggleFavorite(id, evt){

  render();

/* ---------- pressionar 5s para eliminar ---------- */
function onCardPointerDown(e){
  const card = e.target.closest('.card');
  if(!card) return;
  if(e.target.closest('.heart, .btn-ver')) return;
  pressCardEl = card;
  pressStartX = e.clientX; pressStartY = e.clientY;
  card.classList.add('pressing');
  const bar = card.querySelector('.lp-bar');
  if(bar){ bar.style.transition = 'width '+LONG_PRESS_MS+'ms linear'; bar.style.width = '100%'; }
  pressTimer = setTimeout(()=>{
    const id = card.dataset.id;
    resetPressVisual(false);
    pendingDeleteId = id;
    openPwModal('delete');
  }, LONG_PRESS_MS);
}
function onCardPointerMove(e){
  if(!pressTimer || !pressCardEl) return;
  if(Math.abs(e.clientX-pressStartX)>10 || Math.abs(e.clientY-pressStartY)>10){
    cancelPress();
  }
}
function cancelPress(){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  resetPressVisual(true);
}
function resetPressVisual(animate){
  if(!pressCardEl) return;
  pressCardEl.classList.remove('pressing');
  const bar = pressCardEl.querySelector('.lp-bar');
  if(bar){
    bar.style.transition = animate ? 'width 200ms ease-out' : 'none';
    bar.style.width = '0%';
  }
  pressCardEl = null;
}

/* ---------- render dispatcher ---------- */
function render(){
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = viewHome();
  else if(state.view==='catalog') app.innerHTML = viewCatalog(state.params.type||'all', state.params.category||null);
  else if(state.view==='search') app.innerHTML = viewSearch(state.params.query||'');
  else if(state.view==='addType') app.innerHTML = viewAddType();
  else if(state.view==='addForm') app.innerHTML = viewAddForm(state.params.type);
  else app.innerHTML = viewHome();
  updateFavCount();
  if(state.view==='search'){
    searchQuery = state.params.query || '';
    renderSearchResults(searchQuery);
    const si = document.getElementById('searchInput');
    if(si) si.focus();
  }
}

/* ---------- imagem ---------- */
function handleImageSelect(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const label = document.getElementById('imgPickLabel');
      label.innerHTML = '<img src="'+dataUrl+'"><input type="file" accept="image/*" id="imgInput" style="display:none" onchange="handleImageSelect(event)">';
      label.dataset.image = dataUrl;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  const author = document.getElementById('fAuthor').value.trim();
  const category = document.getElementById('fCategory').value;
  const price = document.getElementById('fPrice').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const image = document.getElementById('imgPickLabel').dataset.image;

  if(!link || !/^https?:\/\//i.test(link)){ toast('Introduz um link válido (https://...)'); return; }
  if(!title){ toast('Introduz um título'); return; }
  if(!image){ toast('Escolhe uma imagem de capa'); return; }
  if(price==='' || isNaN(price) || Number(price) < 0){ toast('Introduz um preço válido'); return; }

  pendingProduct = {
    id: uid(), type, link, title, author, category, price: Number(price), description: desc,
    image, createdAt: Date.now()
  };
  openPwModal('publish');
}
function openPwModal(mode){
  pwMode = mode || 'publish';
  const titleEl = document.getElementById('modalTitle');
  const subEl = document.getElementById('modalSub');
  if(pwMode === 'delete'){
    titleEl.innerHTML = icon('lock',18)+' Eliminar produto';
    subEl.textContent = 'Introduz a senha de administrador para eliminar este produto. Esta ação não pode ser desfeita.';
  } else {
    titleEl.innerHTML = icon('lock',18)+' Confirmação necessária';
    subEl.textContent = 'Introduz a senha de administrador para publicar este produto.';
  }
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwOverlay').classList.add('show');
  setTimeout(()=> document.getElementById('pwInput').focus(), 200);
}
function closePwModal(){
  document.getElementById('pwOverlay').classList.remove('show');
}
function confirmPassword(){
  const val = document.getElementById('pwInput').value;
  if(val !== ADMIN_PASS){
    document.getElementById('pwErr').textContent = 'Senha incorreta. Tenta novamente.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    return;
  }
  if(pwMode === 'delete'){
    deleteProduct(pendingDeleteId);
    pendingDeleteId = null;
    closePwModal();
    toast('Produto eliminado');
    render();
    return;
  }
  const list = loadProducts();
  list.push(pendingProduct);
  saveProducts(list);
  const type = pendingProduct.type;
  closePwModal();
  toast('Produto publicado com sucesso');
  navigate('catalog', {type});
  pendingProduct = null;
}
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') confirmPassword(); });

/* ---------- init ---------- */
document.getElementById('app').addEventListener('pointerdown', onCardPointerDown);
document.addEventListener('pointermove', onCardPointerMove);
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
applyTheme();
history.replaceState({view:'home', params:{}}, '');
render();
</script>
</body>
</html>
